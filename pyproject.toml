[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-tradeup-lab"
version = "2.1.0"
description = "CS2 trade-up analysis: guaranteed-profit search, per-item odds, fee-aware EV, adaptive price fetching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cs2", "counter-strike", "trade-up", "steam-market", "expected-value"]
authors = [{ name = "Arthur Mateus" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pytest-asyncio>=0.23"]
supabase = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/ArthurMateus/UVA-TCC-CS2TRADE"

[project.scripts]
tradeup = "tradeup.cli:app"

[tool.setuptools]
packages = ["tradeup", "tradeup.data", "tradeup.prices"]

[tool.setuptools.package-data]
tradeup = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-q"
